<script>
// ---------------------------------------------------------------------------
// Swiss pricing calculator (ported from calculator.ts)
// ---------------------------------------------------------------------------
const DE_VAT = 0.19, CH_VAT = 0.081, DUTY_FREE = 65, VEREINFACHT_FEE = 11.5, EXCHANGE_RATE = 0.94;
function calcSwissPrice(eur) {
  const net = eur / (1 + DE_VAT);
  const chf = net * EXCHANGE_RATE;
  const vat = chf * CH_VAT;
  const customs = chf > DUTY_FREE ? VEREINFACHT_FEE : 0;
  const total = chf + vat + customs;
  return { originalEur: eur, netChf: r(chf), chVat: r(vat), customsFee: r(customs), totalChf: r(total) };
}
function r(v) { return Math.round(v * 100) / 100; }

// ---------------------------------------------------------------------------
// Seeded PRNG
// ---------------------------------------------------------------------------
function seededRandom(seed) {
  let s = seed;
  return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

// ---------------------------------------------------------------------------
// Mock products
// ---------------------------------------------------------------------------
const PRODUCTS = [

    sources:[{id:"amazon_de",name:"Amazon.de",eur:1399},{id:"galaxus_ch",name:"Galaxus",eur:1499}]},
  { gtin:"00889842861037", title:"Samsung Galaxy Watch 6 Classic 47mm", brand:"Samsung", category:"Wearables", img:"Galaxy+Watch",
    sources:[{id:"amazon_de",name:"Amazon.de",eur:319},{id:"galaxus_ch",name:"Galaxus",eur:349},{id:"zalando_de",name:"Zalando",eur:329}]},

const SOURCE_COLORS = { amazon_de:"#FF9900", galaxus_ch:"#0D2B5E", zalando_de:"#FF6900" };

// Generate 30-day history
function genHistory(p) {
  const hist = [];
  const now = Date.now();
  const seed = p.gtin.split("").reduce((a,c) => a + c.charCodeAt(0), 0);
  const rand = seededRandom(seed);
  for (let d = 29; d >= 0; d--) {
    for (const s of p.sources) {
      const drift = 1 + (rand() - 0.5) * 0.16;
      const eur = Math.round(s.eur * drift * 100) / 100;
      hist.push({ day: d, eur, chf: calcSwissPrice(eur).totalChf, sid: s.id });
    }
  }
  return hist;
}

// Build enriched product data
const enriched = PRODUCTS.map(p => {
  const history = genHistory(p);
  const prices = p.sources.map(s => ({ ...s, breakdown: calcSwissPrice(s.eur) }));
  const best = prices.reduce((m,c) => c.breakdown.totalChf < m.breakdown.totalChf ? c : m);
  const oldest = history.filter(h => h.day === 29);
  const oldestBest = Math.min(...oldest.map(h => h.chf));
  const drop = r(oldestBest - best.breakdown.totalChf);
  const spark = history.filter(h => h.sid === best.id).map(h => h.chf);
  return { ...p, history, best, prices, drop, spark };
});

const categories = [...new Set(PRODUCTS.map(p => p.category))];

// ---------------------------------------------------------------------------
// SVG sparkline generator
// ---------------------------------------------------------------------------
function sparklineSVG(data, w=220, h=44) {
  if (data.length < 2) return '';
  const min = Math.min(...data), max = Math.max(...data), range = max - min || 1;
  const pad = 2, iw = w - pad*2, ih = h - pad*2;
  const pts = data.map((v,i) => ({
    x: pad + (i/(data.length-1))*iw,
    y: pad + ih - ((v-min)/range)*ih
  }));
  const line = pts.map((p,i) => `${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const fill = `${line} L${pts[pts.length-1].x.toFixed(1)},${h} L${pts[0].x.toFixed(1)},${h} Z`;
  const down = data[data.length-1] < data[0];
  const col = down ? '#16a34a' : '#dc2626';
  const bg = down ? '#16a34a15' : '#dc262615';
  const last = pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible">
    <path d="${fill}" fill="${bg}"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="2.5" fill="${col}"/>
  </svg>`;
}

// ---------------------------------------------------------------------------
// Render

           +${Math.abs(p.drop).toFixed(0)}
         </span>`;

    const sourceRows = p.prices.map(s => {

    }).join('');

      </div>
    </div>`;
  }).join('');

  const noResults = items.length === 0 ? `

      <svg class="mx-auto h-10 w-10" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>

    </div>` : '';

  document.getElementById('app').innerHTML = `
  <!-- Nav -->
  <header class="sticky top-0 z-40 border-b border-gray-100 bg-white/80 backdrop-blur-lg">
    <div class="mx-auto flex h-14 max-w-7xl items-center justify-between px-4 sm:px-6">
      <div class="flex items-center gap-2">
        <span class="text-lg font-bold tracking-tight">Swiss<span class="text-red-600">Price</span>Runner</span>
        <span class="hidden rounded bg-red-50 px-1.5 py-0.5 text-[10px] font-bold uppercase text-red-600 sm:inline">Beta</span>
      </div>
      <div class="flex items-center gap-2 text-xs text-gray-500">
        <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
        DE | FR | IT | EN
      </div>
    </div>
  </header>

  <!-- Hero -->
  <section class="relative overflow-hidden bg-white pb-12 pt-16 sm:pt-24">
    <div class="pointer-events-none absolute -right-24 -top-24 h-96 w-96 opacity-[0.03]">
      <svg viewBox="0 0 100 100" class="h-full w-full"><rect x="35" y="10" width="30" height="80" fill="currentColor" rx="2"/><rect x="10" y="35" width="80" height="30" fill="currentColor" rx="2"/></svg>
    </div>
    <div class="mx-auto max-w-3xl px-4 text-center sm:px-6">

        <div><p class="text-2xl font-bold text-gray-900">10+</p><p class="text-xs text-gray-400">Produkte</p></div>

        <button onclick="activeCat=null;render()" class="rounded-full px-3 py-1 text-xs font-medium transition ${!activeCat?'bg-gray-900 text-white':'bg-gray-100 text-gray-600 hover:bg-gray-200'}">Alle</button>

}

render();
</script>
