name: Recategorize Products

# One-shot (manual-dispatch) recategorization against the live DB.
# Runs scripts/recategorize-runner.ts which re-maps every Product.category
# to the new 3-level taxonomy based on lib/category-rules.ts.

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Products per batch"
        required: false
        default: "1000"
      only:
        description: "Limit to a single current category slug (optional)"
        required: false
        default: ""
      limit:
        description: "Hard cap on total products scanned (optional)"
        required: false
        default: ""
      dry_run:
        description: "Dry run — scan + log diffs, no DB writes"
        required: false
        default: "false"
        type: boolean

jobs:
  recategorize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}

      - name: Run recategorize
        run: |
          ARGS="--batch ${{ inputs.batch || '1000' }}"
          if [ -n "${{ inputs.only }}" ]; then
            ARGS="$ARGS --only ${{ inputs.only }}"
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry"
          fi
          echo "Running: npx tsx scripts/recategorize-runner.ts $ARGS"
          npx tsx scripts/recategorize-runner.ts $ARGS
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
