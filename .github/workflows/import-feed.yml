name: Import Feed

# Generic import dispatcher — pick a feed key, run the standalone
# import-runner against the live DB.
#
# The "Normalize DB URL" step (shared across all data workflows) picks
# the direct (non-pooled) URL when available and auto-applies
# ?pgbouncer=true&connection_limit=1 for pooler hosts — prevents
# "prepared statement s0 already exists" on bulk upserts.

on:
  workflow_dispatch:
    inputs:
      feed:
        description: 'Feed key'
        required: true
        default: 'new_balance'
        type: choice
        options:
          - parfumsale
          - xxl_parfum
          - import_parfumerie
          - coop_vitality
          - new_balance
          - parfum_ch
          - ackermann_ch
      limit:
        description: 'Items per batch'
        required: false
        default: '100'
      scrub:
        description: 'Scrub mode (overwrite all fields)'
        required: false
        default: 'false'
        type: boolean
      force_pooled:
        description: "Force use of the pooled DATABASE_URL (auto-adds ?pgbouncer=true)"
        required: false
        default: "false"
        type: boolean

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Normalize DB URL
        env:
          RAW_NON_POOLED: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          RAW_DATABASE:   ${{ secrets.DATABASE_URL }}
          FORCE_POOLED:   ${{ inputs.force_pooled }}
        run: node .github/scripts/normalize-db-url.js

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run import
        run: npx tsx scripts/import-runner.ts --feed ${{ inputs.feed }} --limit ${{ inputs.limit }} ${{ inputs.scrub == true && '--scrub' || '' }}
        env:
          PARFUM_CH_FEED_URL: ${{ secrets.PARFUM_CH_FEED_URL }}
          ACKERMANN_FEED_URL: ${{ secrets.ACKERMANN_FEED_URL }}
