name: Import Feed

on:
  workflow_dispatch:
    inputs:
      feed:
        description: 'Feed key'
        required: true
        default: 'new_balance'
        type: choice
        options:
          - parfumsale
          - xxl_parfum
          - import_parfumerie
          - coop_vitality
          - new_balance
          - parfum_ch
      limit:
        description: 'Items per batch'
        required: false
        default: '100'
      scrub:
        description: 'Scrub mode (overwrite all fields)'
        required: false
        default: 'false'
        type: boolean

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}

      - name: Run import
        run: npx tsx scripts/import-runner.ts --feed ${{ inputs.feed }} --limit ${{ inputs.limit }} ${{ inputs.scrub == true && '--scrub' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          PARFUM_CH_FEED_URL: ${{ secrets.PARFUM_CH_FEED_URL }}
