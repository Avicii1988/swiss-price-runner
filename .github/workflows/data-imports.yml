name: "[DATA] Import Shops"

# Single workflow for ALL shop imports. Select one shop from the dropdown
# or pick "all" to run every feed sequentially. Replaces the 9 individual
# import-*.yml files.
#
# Each feed runs the same import-runner.ts CLI — the only difference is
# the --feed key. The "Run All" path iterates through every registered
# feed and continues on failure so a single broken feed doesn't block
# the rest.

on:
  workflow_dispatch:
    inputs:
      shop:
        description: "Shop to import"
        required: true
        type: choice
        options:
          - "all"
          - xxl_parfum
          - parfumsale
          - import_parfumerie
          - coop_vitality
          - new_balance
          - parfum_ch
          - ackermann_ch
          - ackermann-mode
          - jelmoli
          - jelmoli-mode
          - bijouteria
          - bergfreunde
          - mobilezone
          - ochsner-sport
          - ochsner-shoes
          - nettoshop
      limit:
        description: "Items per batch (default 100)"
        required: false
        default: "100"
      scrub:
        description: "Scrub mode (overwrite all fields, not just fill-in)"
        required: false
        default: "false"
        type: boolean
      force_pooled:
        description: "Force use of the pooled DATABASE_URL"
        required: false
        default: "false"
        type: boolean

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Normalize DB URL
        env:
          RAW_NON_POOLED: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          RAW_DATABASE:   ${{ secrets.DATABASE_URL }}
          FORCE_POOLED:   ${{ inputs.force_pooled }}
        run: node .github/scripts/normalize-db-url.js

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: "Import: ${{ inputs.shop }}"
        run: |
          SHOPS="${{ inputs.shop }}"
          LIMIT="${{ inputs.limit || '100' }}"
          SCRUB_FLAG=""
          if [ "${{ inputs.scrub }}" = "true" ]; then
            SCRUB_FLAG="--scrub"
          fi

          if [ "$SHOPS" = "all" ]; then
            SHOPS="xxl_parfum parfumsale import_parfumerie coop_vitality new_balance parfum_ch ackermann_ch ackermann-mode jelmoli jelmoli-mode bijouteria bergfreunde mobilezone ochsner-sport ochsner-shoes nettoshop"
          fi

          FAILED=""
          for SHOP in $SHOPS; do
            echo ""
            echo "═══════════════════════════════════════════════════════"
            echo "  Importing: $SHOP (limit=$LIMIT)"
            echo "═══════════════════════════════════════════════════════"
            if npx tsx scripts/import-runner.ts --feed "$SHOP" --limit "$LIMIT" $SCRUB_FLAG; then
              echo "✓ $SHOP completed"
            else
              echo "✗ $SHOP FAILED — continuing with next shop"
              FAILED="$FAILED $SHOP"
            fi
          done

          if [ -n "$FAILED" ]; then
            echo ""
            echo "⚠ Failed shops:$FAILED"
            exit 1
          fi
