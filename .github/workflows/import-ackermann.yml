name: Import Ackermann Technik

# Dedicated workflow for the Ackermann Technik Adtraction feed.
# Runs the standalone import-runner with the ackermann_ch feed key.
# The feed URL can be overridden via the ACKERMANN_FEED_URL secret/env —
# otherwise the baked-in default in scripts/import-runner.ts is used.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Items per batch"
        required: false
        default: "100"
      scrub:
        description: "Scrub mode (overwrite all fields, not just fill-in)"
        required: false
        default: "false"
        type: boolean
      feed_url:
        description: "Override Adtraction feed URL (optional)"
        required: false
        default: ""
  schedule:
    # Daily at 04:00 UTC (06:00 CEST) — staggered after Parfum.ch (03:30)
    - cron: "0 4 * * *"

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}

      - name: Run Ackermann Technik import
        run: npx tsx scripts/import-runner.ts --feed ackermann_ch --limit ${{ inputs.limit || '100' }} ${{ inputs.scrub == true && '--scrub' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          ACKERMANN_FEED_URL: ${{ inputs.feed_url != '' && inputs.feed_url || secrets.ACKERMANN_FEED_URL }}
