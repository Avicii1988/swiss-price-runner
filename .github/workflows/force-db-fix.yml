name: Force DB Fix

# One-shot manual workflow that bypasses `prisma db push` (which times out
# against the Supabase pooler) and applies the missing Product-table DDL
# directly via raw SQL. The script is idempotent — safe to re-run.
#
# Adds:
#   Columns  shippingCostChf · priceIsNet · groupId · baseTitle · sizeLabel
#   Indexes  Product_groupId_idx · Product_isActive_groupId_idx
#
# Secrets:
#   POSTGRES_URL_NON_POOLING  — preferred: direct (non-pooled) connection
#   DATABASE_URL              — fallback: pooled connection

on:
  workflow_dispatch:
    inputs:
      force_pooled:
        description: "Force the pooled DATABASE_URL instead of direct"
        required: false
        default: "false"
        type: boolean

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ─────────────────────────────────────────────────────────────
      # Normalize DB URL — shared script, see .github/scripts/normalize-db-url.js
      # Exports POSTGRES_URL / POSTGRES_URL_NON_POOLING / DATABASE_URL.
      # ─────────────────────────────────────────────────────────────
      - name: Normalize DB URL
        env:
          RAW_NON_POOLED: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          RAW_DATABASE:   ${{ secrets.DATABASE_URL }}
          FORCE_POOLED:   ${{ inputs.force_pooled }}
        run: node .github/scripts/normalize-db-url.js

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run fix-db
        run: npx tsx scripts/fix-db.ts
