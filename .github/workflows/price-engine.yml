name: "[PRICE] Daily Import Engine"

# Nightly price engine — runs every registered feed sequentially so
# the catalogue stays fresh. Each shop runs in its own step so failures
# are isolated: if Jelmoli is down, Bergfreunde still imports.
#
# Schedule: 03:00 UTC (05:00 CEST) — off-peak for both Supabase and
# the Adtraction feed servers.
#
# Can also be triggered manually via workflow_dispatch (same inputs as
# the [DATA] Import Shops workflow but with 'all' hardcoded).

on:
  # Nightly schedule paused to reduce costs. Re-enable by
  # uncommenting the two lines below.
  # schedule:
  #   - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "XML parse window per outer loop iteration (DB writes are always capped at 50 rows)"
        required: false
        default: "500"
      force_pooled:
        description: "Force use of the pooled DATABASE_URL"
        required: false
        default: "false"
        type: boolean

env:
  LIMIT: ${{ inputs.limit || '500' }}
