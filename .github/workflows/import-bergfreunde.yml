name: Import Bergfreunde

# Dedicated workflow for the Bergfreunde Adtraction feed (pfid=1213).
# Runs the standalone import-runner with the bergfreunde feed key.
# The feed URL can be overridden via the BERGFREUNDE_FEED_URL secret —
# otherwise the baked-in default in scripts/import-runner.ts is used.
#
# The "Normalize DB URL" step prevents "prepared statement s0 already
# exists" by preferring the direct non-pooled URL and auto-applying
# ?pgbouncer=true&connection_limit=1 when only the pooler is available.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Items per batch"
        required: false
        default: "100"
      scrub:
        description: "Scrub mode (overwrite all fields, not just fill-in)"
        required: false
        default: "false"
        type: boolean
      feed_url:
        description: "Override Adtraction feed URL (optional)"
        required: false
        default: ""
      force_pooled:
        description: "Force use of the pooled DATABASE_URL (auto-adds ?pgbouncer=true)"
        required: false
        default: "false"
        type: boolean
  schedule:
    # Daily at 04:30 UTC (06:30 CEST) — staggered after Ackermann (04:00)
    - cron: "30 4 * * *"

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Normalize DB URL
        env:
          RAW_NON_POOLED: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          RAW_DATABASE:   ${{ secrets.DATABASE_URL }}
          FORCE_POOLED:   ${{ inputs.force_pooled }}
        run: node .github/scripts/normalize-db-url.js

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Bergfreunde import
        run: npx tsx scripts/import-runner.ts --feed bergfreunde --limit ${{ inputs.limit || '100' }} ${{ inputs.scrub == true && '--scrub' || '' }}
        env:
          BERGFREUNDE_FEED_URL: ${{ inputs.feed_url != '' && inputs.feed_url || secrets.BERGFREUNDE_FEED_URL }}
